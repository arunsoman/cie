<!doctype html>
<!-- TC-02 (CIE-VIZ-MULTI): flame graph in G6 via ONE custom layout + ONE
     custom node — the Part V proof that the architecture generalizes.
     Open in a browser (needs network for esm.sh). The epistemic law
     (stroke + dash per displayMode) is preserved on every frame. -->
<html>
<meta charset="utf-8" />
<title>CIE-VIZ-MULTI · TC-02 Flame Graph (G6 custom extensions)</title>
<body style="margin:0;background:#0d1117;color:#c9d1d9;font-family:monospace">
<div style="padding:8px 12px">
  flame graph · <span style="color:#2ea043">■ Fact</span>
  <span style="color:#f85149">■ Hypothesis (dotted)</span> · fisheye ON
</div>
<div id="c" style="width:960px;height:540px"></div>
<script type="module">
import { Graph, register, ExtensionCategory, BaseLayout, Rect } from 'https://esm.sh/@antv/g6@5';

// ── The pure geometry (mirrors viz-adapter/src/engines/flame.ts) ────────
function computeFlameGeometry(nodes, edges, canvasWidth = 960, levelHeight = 40) {
  const childrenOf = {}, parentOf = {};
  for (const e of edges) { (childrenOf[e.source] ??= []).push(e.target); parentOf[e.target] = e.source; }
  const byId = new Map(nodes.map((n) => [n.id, n]));
  const root = nodes.find((n) => !(n.id in parentOf));
  const frames = {};
  const visit = (id, depth, xOffset) => {
    const n = byId.get(id); if (!n) return;
    const width = (n.samples / root.samples) * canvasWidth;
    frames[id] = { x: xOffset, y: depth * levelHeight, width, height: levelHeight, depth };
    let cx = xOffset;
    for (const c of childrenOf[id] ?? []) {
      const cn = byId.get(c); if (!cn) continue;
      visit(c, depth + 1, cx); cx += (cn.samples / root.samples) * canvasWidth;
    }
  };
  visit(root.id, 0, 0);
  return frames;
}

// ── ViewSpec (PRD §11) ──────────────────────────────────────────────────
const spec = {
  elements: [
    { id: 'root', elementKind: 'stack-frame', displayMode: 'Fact', label: 'main 1000',
      evidence: { file: 'app.py', start: 0, end: 9 }, salience: { factors: ['RUNTIME_HOTNESS'], weight: 1, whyShown: 'root' },
      fields: { samples: 1000, depth: 0 } },
    { id: 'f1', elementKind: 'stack-frame', displayMode: 'Fact', label: 'handleRequest 600',
      evidence: { file: 'api.py', start: 10, end: 19 }, salience: { factors: ['RUNTIME_HOTNESS'], weight: .8, whyShown: 'hot' },
      fields: { samples: 600, depth: 1 } },
    { id: 'f2', elementKind: 'stack-frame', displayMode: 'Fact', label: 'serialize 400',
      evidence: { file: 'json.py', start: 20, end: 29 }, salience: { factors: ['RUNTIME_HOTNESS'], weight: .7, whyShown: 'hot' },
      fields: { samples: 400, depth: 1 } },
    { id: 'f1a', elementKind: 'stack-frame', displayMode: 'Fact', label: 'db.query 450',
      evidence: { file: 'db.py', start: 30, end: 39 }, salience: { factors: ['RUNTIME_HOTNESS'], weight: .6, whyShown: 'hot' },
      fields: { samples: 450, depth: 2 } },
    { id: 'f1b', elementKind: 'stack-frame', displayMode: 'Hypothesis', label: 'cache.hit 150',
      claimId: 'C-0099', counterArgument: 'no cache instrumentation observed',
      evidence: { file: 'cache.py', start: 40, end: 49 }, salience: { factors: ['USER_OVERRIDE'], weight: .3, whyShown: 'pinned' },
      fields: { samples: 150, depth: 2 } },
  ],
  edges: [
    { id: 'e1', source: 'root', target: 'f1', edgeKind: 'calls', displayMode: 'Fact', evidence: { file: 'app.py', start: 1, end: 2 } },
    { id: 'e2', source: 'root', target: 'f2', edgeKind: 'calls', displayMode: 'Fact', evidence: { file: 'app.py', start: 3, end: 4 } },
    { id: 'e3', source: 'f1', target: 'f1a', edgeKind: 'calls', displayMode: 'Fact', evidence: { file: 'api.py', start: 5, end: 6 } },
    { id: 'e4', source: 'f1', target: 'f1b', edgeKind: 'calls', displayMode: 'Fact', evidence: { file: 'api.py', start: 7, end: 8 } },
  ],
  layoutHint: { strategy: 'cie-flame' },
  footer: { facts: 4, inferences: 0, hypotheses: 1, fog: 0, stale: 0,
            caption: 'Display categories, not a confidence score.' },
  gaps: [], hidden: [],
  scope: { revision: 42, environments: [], coverage: { analyzed: true } },
};

const DASH   = { Fact: undefined, Inference: [6,4], Hypothesis: [2,4], Fog: [1,3] };
const STROKE = { Fact: '#2ea043', Inference: '#d29922', Hypothesis: '#f85149', Fog: '#8b949e' };
const depthColor = (d) => { const t = Math.min(d, 8) / 8;
  return `rgb(${22 + t * 110 | 0},${27 + t * 40 | 0},${34 + t * 10 | 0})`; };

// ── ONE custom layout + ONE custom node (the whole "chart") ────────────
class FlameLayout extends BaseLayout {
  id = 'cie-flame';
  async execute(model) {
    const frames = computeFlameGeometry(
      model.nodes.map((n) => ({ id: n.id, samples: n.data.fields.samples ?? 0 })),
      model.edges.map((e) => ({ source: e.source, target: e.target })), 960, 40);
    for (const n of model.nodes) {
      const f = frames[n.id]; if (!f) continue;
      n.style.x = f.x + f.width / 2;
      n.style.y = f.y + f.height / 2;
      n.style.size = [f.width, f.height];
    }
  }
}
register(ExtensionCategory.LAYOUT, 'cie-flame', FlameLayout);

class FlameFrame extends Rect {
  render(attributes, container) {
    super.render(attributes, container);
    const [w] = attributes.size;
    const maxChars = Math.max(0, Math.floor(w / 7));
    const label = attributes.data.label.length > maxChars
      ? attributes.data.label.slice(0, Math.max(1, maxChars - 1)) + '…' : attributes.data.label;
    this.upsert('label', 'text', {
      text: label, x: 0, y: 0, textAlign: 'center', textBaseline: 'middle',
      fontSize: 11, fill: '#c9d1d9', pointerEvents: 'none',
    }, container);
  }
}
register(ExtensionCategory.NODE, 'cie-flame-frame', FlameFrame);

const graph = new Graph({
  container: 'c',
  data: {
    nodes: spec.elements.map((el) => ({ id: el.id, data: {
      label: el.label, displayMode: el.displayMode, fields: el.fields } })),
    edges: spec.edges.map((e) => ({ id: e.id, source: e.source, target: e.target, data: {} })),
  },
  node: {
    type: 'cie-flame-frame',
    style: {
      fill: (d) => depthColor(d.data.fields.depth),
      stroke: (d) => STROKE[d.data.displayMode],
      lineDash: (d) => DASH[d.data.displayMode],
      lineWidth: (d) => (d.data.displayMode === 'Fact' ? 1 : 1.5),
      radius: 2,
    },
  },
  edge: { style: { opacity: 0 } },
  layout: { type: 'cie-flame' },
  plugins: [{ type: 'fisheye', key: 'cie-fisheye', trigger: 'pointermove', d: 1.5, r: 120 }],
});
await graph.render();
window.__graph = graph;
window.__spec = spec;
</script>
</body>
</html>
