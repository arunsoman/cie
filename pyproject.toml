[project]
name = "cie-mcp"
version = "0.1.2"
description = "Code Insight Engine — a pluggable, language-agnostic code graph + LLM tool surface (MCP/HTTP/CLI) with an embedded SQLite or Neo4j backend."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Arun Soman", email = "aarunsoman@gmail.com"}]
keywords = ["code-graph", "call-graph", "mcp", "llm-tools", "tree-sitter", "neo4j", "code-intelligence"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "neo4j>=5.0.0",
    "pydantic>=2.7.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-rust>=0.23.0",
    "tree-sitter-c>=0.23.0",
    "tree-sitter-cpp>=0.23.0",
    "tree-sitter-c-sharp>=0.23.0",
    "watchdog>=6.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "tomli>=1.2.0; python_version < '3.11'",
]

# routes.py (the HTTP tool-mount) and mock_server.py are the only two
# modules that import fastapi/starlette/uvicorn — everything else (the
# query engine, extraction, task/hierarchy repos, ToolService itself) has
# no HTTP dependency at all. Pull this extra in only if you actually mount
# cie's routes or use its mock server; `pip install cie[http]`.
#
# mcp_server.py is the real Model Context Protocol adapter — optional
# since not every use of cie needs an
# MCP server; `pip install cie[mcp]`.
[project.optional-dependencies]
http = ["fastapi>=0.111.0", "uvicorn[standard]>=0.30.0"]
mcp = ["mcp>=2.0.0"]

[project.scripts]
cie = "cie.cli:main"
cie-mcp = "cie.mcp_server:main"

[project.urls]
Homepage = "https://github.com/kannamma-labs/cie"
Repository = "https://github.com/kannamma-labs/cie"
"Bug Tracker" = "https://github.com/kannamma-labs/cie/issues"
Changelog = "https://github.com/kannamma-labs/cie/blob/main/CHANGELOG.md"
Documentation = "https://github.com/kannamma-labs/cie/blob/main/docs/language-agnostic-design.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cie"]

[tool.pytest.ini_options]
# Scope collection to tests/ only. NOTE: do NOT run bare `pytest` with
# default discovery — cie/test_orchestration.py and cie/test_synthesis.py
# are *feature modules* (not tests) whose names start with `test_`; they
# import a host-project `core.llm` that isn't on the path in a standalone
# checkout, so collecting them errors. testpaths keeps `pytest` (no args)
# correct.
testpaths = ["tests"]
# tests/fixtures/sandbox/test_app.py is CONFORMANCE FIXTURE data (R17 —
# the harness runs real tools against it), not a test; collecting it
# produced a bogus red (its `from app import alpha` needs the fixture's
# own cwd, which pytest doesn't provide).
norecursedirs = ["tests/fixtures"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]
