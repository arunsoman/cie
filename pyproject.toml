[project]
name = "cie"
version = "0.1.0"
description = "Code Insight Engine — a pluggable, language-agnostic code-graph, task, and LLM-tool surface backed by Neo4j."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "neo4j>=5.0.0",
    "pydantic>=2.7.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-java>=0.23.5",
    "watchdog>=6.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

# routes.py (the HTTP tool-mount) and mock_server.py are the only two
# modules that import fastapi/starlette/uvicorn — everything else (the
# query engine, extraction, task/hierarchy repos, ToolService itself) has
# no HTTP dependency at all. Pull this extra in only if you actually mount
# cie's routes or use its mock server; `pip install cie[http]`.
#
# mcp_server.py is the real Model Context Protocol adapter (docs/
# growth-plan.md Phase 0) — optional since not every use of cie needs an
# MCP server; `pip install cie[mcp]`.
[project.optional-dependencies]
http = ["fastapi>=0.111.0", "uvicorn[standard]>=0.30.0"]
mcp = ["mcp>=2.0.0"]

[project.scripts]
cie = "cie.cli:main"
cie-mcp = "cie.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cie"]

[dependency-groups]
dev = ["pytest>=8"]
