[package]
name = "cie-store"
description = "Revisioned KV store (§15.1 namespaces) — JSON engine; sled/redb backends"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
cie-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }
sha2 = "0.10"
rkyv = { workspace = true }
rustc-hash = { workspace = true }
dashmap = { workspace = true }
quick_cache = { workspace = true }
hnsw_rs = { workspace = true }
memmap2 = { workspace = true }
zstd = { workspace = true }
sled = { workspace = true, optional = true }
redb = { workspace = true, optional = true }

[features]
# DS-EVAL §4/§6.5: sled is CUT from the default build — zero production
# call sites (grep-verified) and effectively unmaintained upstream (pinned
# "0.34", last release 2021). MemKv is always available; redb stays behind
# its flag as the designated dormant fallback (kv_suite-verified swap needs
# zero call-site changes by TASK-024's design).
default = []
backend-sled = ["dep:sled"]
backend-redb = ["dep:redb"]


[dev-dependencies]
cie-relations = { workspace = true }
