version: 2
updates:
  # Python dependencies (pyproject.toml).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      # Group the four tree-sitter grammar wheels so one pin bump is one PR,
      # not four — they move together and a partial bump just breaks parsing.
      tree-sitter:
        patterns:
          - "tree-sitter"
          - "tree-sitter-python"
          - "tree-sitter-javascript"
          - "tree-sitter-typescript"
          - "tree-sitter-java"
    commit-message:
      prefix: "deps(pip)"

  # GitHub Actions used in .github/workflows/.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "deps(ci)"