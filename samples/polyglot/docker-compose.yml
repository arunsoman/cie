services:
  berth-booking:
    build: ./berth-booking
    ports: ["8081:8081"]
  billing:
    build: ./billing
    ports: ["8082:8083"]
  tide-alerts:
    build: ./tide-alerts
    ports: ["8083:8080"]
  search:
    build: ./search
    ports: ["8084:3000"]
  webhooks:
    build: ./webhooks
    ports: ["8085:5000"]
  # image-only service — no in-repo source, no build context. The engine
  # reads this as an EXTERNAL system (C4 Context), not a container of this
  # stack: it is software the apps depend on, but CIE did not parse it.
  cache:
    image: redis:7-alpine
