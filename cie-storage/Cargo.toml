[package]
name = "cie-storage"
description = "Typed repository storage API, physical persistence policy and revision transactions"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
cie-viz = { workspace = true }
cie-analysis = { workspace = true }
cie-core = { workspace = true }
cie-store = { workspace = true }
cie-semantic = { workspace = true }
cie-adapters = { workspace = true }
cie-polyglot = { workspace = true }
cie-stack = { workspace = true }
cie-contract = { workspace = true }
cie-relations = { workspace = true }
cie-incremental = { workspace = true }
cie-concepts = { workspace = true }
cie-llm = { workspace = true }
serde = { workspace = true }
schemars = "1"
serde_json = { workspace = true, features = ["raw_value"] }
blake3 = { workspace = true }
zstd = { workspace = true }
tree-sitter = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled", "backup", "hooks"] }
unicode-casefold = "0.2.0"
chrono = "0.4.45"
chrono-tz = "0.10.4"
cie-summary = { workspace = true }

[dev-dependencies]
cie-adapter-python = { workspace = true }
