[package]
name = "cie-storage-node"
description = "In-process Node binding for revision-pinned CIE storage"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
cie-storage = { workspace = true }
serde_json = { workspace = true }
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"
