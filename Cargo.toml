[workspace]
resolver = "2"
members = [
    "crates/cie-core",
    "crates/cie-storage",
    "crates/cie-langs",
    "crates/cie-analysis",
    "crates/cie-llm",
    "crates/cie-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["Arun Soman"]
repository = "https://github.com/arunsoman/cie"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
rayon = "1"
regex = "1"
clap = { version = "4", features = ["derive"] }
ureq = { version = "2", features = ["json"] }
tree-sitter = "0.25"
tree-sitter-language = "0.1"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-rust = "0.23"

cie-core = { path = "crates/cie-core" }
cie-storage = { path = "crates/cie-storage" }
cie-langs = { path = "crates/cie-langs" }
cie-analysis = { path = "crates/cie-analysis" }
cie-llm = { path = "crates/cie-llm" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
